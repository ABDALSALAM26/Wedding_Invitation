<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Wedding Intro</title>

  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@300;400;600&display=swap"
        rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      overflow:hidden;

      background:
      radial-gradient(circle at center,
      rgba(255,0,120,.18),
      transparent 45%),

      radial-gradient(circle at bottom,
      rgba(255,80,160,.12),
      transparent 60%),

      #04010a;

      font-family:
      "Cormorant Garamond",
      serif;
    }

    #intro{

      position:relative;

      width:100vw;
      height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;
    }

    canvas{

      position:absolute;
      inset:0;

      width:100%;
      height:100%;
    }

    .intro-text{

      position:absolute;

      z-index:100;

      width:min(90vw,580px);

      text-align:center;

      padding:
      clamp(25px,4vw,45px);

      opacity:0;

      transform:
      translateY(30px)
      scale(.85);

      transition:
      all 1.5s ease;

      background:
      rgba(255,255,255,.06);

      backdrop-filter:
      blur(18px);

      -webkit-backdrop-filter:
      blur(18px);

      border:
      1px solid
      rgba(255,255,255,.15);

      border-radius:35px;

      box-shadow:
      0 0 60px
      rgba(255,80,160,.25),

      inset 0 0 25px
      rgba(255,255,255,.05);
    }

    .intro-text.visible{

      opacity:1;

      transform:
      translateY(0)
      scale(1);
    }

    .nice-day{

      color:white;

      letter-spacing:6px;

      font-size:
      clamp(24px,4vw,42px);

      margin-bottom:18px;
    }

    .wedding-date{

      color:#ff7cb6;

      font-size:
      clamp(30px,5vw,52px);

      margin-bottom:22px;
    }

    .names{

      display:flex;

      justify-content:center;
      align-items:center;

      flex-wrap:wrap;

      gap:15px;
    }

    .name{

      color:white;

      font-family:"Allura",cursive;

      font-size:
      clamp(46px,8vw,86px);
    }

    .ampersand{

      color:#ff4d90;

      font-family:"Allura",cursive;

      font-size:
      clamp(50px,8vw,92px);
    }

    .show-btn{

      position:absolute;

      bottom:8%;

      z-index:150;

      opacity:0;

      transform:
      translateY(25px);

      transition:1.2s;
    }

    .show-btn.visible{

      opacity:1;

      transform:
      translateY(0);
    }

    .show-btn button{

      border:none;

      cursor:pointer;

      color:white;

      letter-spacing:4px;

      font-size:18px;

      padding:18px 60px;

      border-radius:60px;

      background:
      linear-gradient(135deg,
      rgba(255,80,160,.5),
      rgba(255,255,255,.12));

      box-shadow:
      0 0 40px
      rgba(255,80,160,.6);

      backdrop-filter:
      blur(10px);

      transition:.4s;
    }

    .show-btn button:hover{

      transform:
      scale(1.06);

      box-shadow:
      0 0 65px
      rgba(255,80,160,.95);
    }

  </style>

</head>

<body>

<div id="intro">

  <canvas id="canvas"></canvas>

  <div class="intro-text"
       id="intro-text">

    <div class="nice-day">
      SAVE THE DATE
    </div>

    <div class="wedding-date">
      4 / 8 / 2026
    </div>

    <div class="names">

      <span class="name">
        Mohamed
      </span>

      <span class="ampersand">
        &
      </span>

      <span class="name">
        Asmaa
      </span>

    </div>

  </div>

  <div class="show-btn"
       id="show-btn">

    <button onclick="showInvitation()">
      SHOW INVITATION
    </button>

  </div>

</div>

<script>
  const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  buildHeart();
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

const cx = () => canvas.width / 2;
const cy = () => canvas.height / 2;

let frame = 0;
let textShown = false;
let animId;

let heartPaths = [];
let particles = [];

function heartPoint(t, scale) {

  return {

    x:
      scale *
      16 *
      Math.pow(Math.sin(t), 3),

    y:
      -scale *
      (
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t)
      )
  };
}

function buildHeart() {

  heartPaths = [];

  const scale =
    Math.min(canvas.width, canvas.height) / 38;

  for (let i = 0; i < 1600; i++) {

    const t1 = Math.random() * Math.PI * 2;
    const t2 = Math.random() * Math.PI * 2;

    const p1 = heartPoint(t1, scale);
    const p2 = heartPoint(t2, scale);

    heartPaths.push({

      x1: p1.x,
      y1: p1.y,

      x2: p2.x,
      y2: p2.y,

      curveX:
        (Math.random() - .5) * scale * 15,

      curveY:
        (Math.random() - .5) * scale * 15,

      width:
        .3 + Math.random() * 1.2,

      alpha:
        .08 + Math.random() * .3,

      hue:
        330 + Math.random() * 25
    });
  }
}

function buildParticles() {

  particles = [];

  for (let i = 0; i < 180; i++) {

    particles.push({

      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,

      r: Math.random() * 3 + .5,

      speed: .2 + Math.random() * .8,

      alpha: Math.random()
    });
  }
}

buildHeart();
buildParticles();
  function drawParticles() {

  particles.forEach(p => {

    p.y -= p.speed;

    if (p.y < -10) {

      p.y = canvas.height + 10;
      p.x = Math.random() * canvas.width;
    }

    ctx.beginPath();

    ctx.fillStyle =
      `rgba(255,120,180,${p.alpha})`;

    ctx.shadowBlur = 15;
    ctx.shadowColor = "#ff4d90";

    ctx.arc(
      p.x,
      p.y,
      p.r,
      0,
      Math.PI * 2
    );

    ctx.fill();
  });
}

function drawHeart() {

  const pulse =
    1 + Math.sin(frame * 0.04) * 0.03;

  ctx.save();

  ctx.translate(cx(), cy());

  ctx.scale(pulse, pulse);

  heartPaths.forEach(line => {

    ctx.beginPath();

    ctx.globalAlpha =
      line.alpha +
      Math.sin(frame * 0.02) * 0.05;

    ctx.lineWidth = line.width;

    ctx.strokeStyle =
      `hsla(${line.hue},
      100%,
      72%,
      1)`;

    ctx.shadowBlur = 18;
    ctx.shadowColor =
      `hsla(${line.hue},
      100%,
      72%,
      1)`;

    ctx.moveTo(line.x1, line.y1);

    ctx.quadraticCurveTo(

      line.curveX,
      line.curveY,

      line.x2,
      line.y2
    );

    ctx.stroke();
  });

  ctx.restore();

  ctx.globalAlpha = 1;
}

function animate() {

  animId =
    requestAnimationFrame(animate);

  frame++;

  ctx.fillStyle =
    "rgba(4,1,10,0.08)";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  drawParticles();

  drawHeart();

  if (frame > 90 && !textShown) {

    textShown = true;

    document
      .getElementById("intro-text")
      .classList.add("visible");

    setTimeout(() => {

      document
        .getElementById("show-btn")
        .classList.add("visible");

    }, 800);
  }
}

animate();

function showInvitation() {

  const intro =
    document.getElementById("intro");

  intro.style.transition =
    "opacity .8s ease";

  intro.style.opacity = "0";

  cancelAnimationFrame(animId);

  setTimeout(() => {

    window.location.href =
      "main.html";

  }, 800);
  }
  </script>
</body>
</html>
