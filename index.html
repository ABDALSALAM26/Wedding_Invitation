<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Wedding Intro</title>

  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@300;400;600&display=swap"
    rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background:
        radial-gradient(circle at center,
          rgba(255, 0, 120, .15),
          transparent 50%),
        #040208;

      font-family: "Cormorant Garamond", serif;
    }

    #intro {
      width: 100vw;
      height: 100vh;

      position: relative;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .intro-text {

      position: absolute;
      z-index: 999;

      text-align: center;

      opacity: 0;
      transform: scale(.8);

      transition: all 1.5s ease;

      padding: clamp(20px, 4vw, 45px);

      width: min(90vw, 560px);

      background: rgba(255, 255, 255, .05);

      backdrop-filter: blur(16px);

      border-radius: 30px;

      border: 1px solid rgba(255,255,255,.12);

      box-shadow:
        0 0 50px rgba(255, 80, 150, .18);
    }

    .intro-text.visible {
      opacity: 1;
      transform: scale(1);
    }

    .nice-day {

      font-family: "Cormorant Garamond", serif;

      font-size: clamp(26px, 4vw, 42px);

      color: #fff;

      letter-spacing: 6px;

      margin-bottom: 20px;
    }

    .wedding-date {

      font-size: clamp(24px, 5vw, 48px);

      color: #ff8ab7;

      margin-bottom: 25px;

      letter-spacing: 4px;
    }

    .names {

      display: flex;

      justify-content: center;
      align-items: center;

      flex-wrap: wrap;

      gap: 12px;
    }

    .name {

      font-family: "Allura", cursive;

      color: white;

      font-size: clamp(42px, 7vw, 78px);
    }

    .ampersand {

      color: #ff4d8f;

      font-family: "Allura", cursive;

      font-size: clamp(48px, 8vw, 82px);
    }

    .show-btn {

      position: absolute;

      bottom: 8%;

      z-index: 1000;

      opacity: 0;

      transform: translateY(30px);

      transition: 1s ease;
    }

    .show-btn.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .show-btn button {

      border: none;

      color: white;

      cursor: pointer;

      padding: 18px 55px;

      border-radius: 60px;

      font-size: 18px;

      letter-spacing: 4px;

      background:
        linear-gradient(135deg,
          rgba(255, 60, 140, .5),
          rgba(255, 150, 200, .25));

      backdrop-filter: blur(10px);

      box-shadow:
        0 0 40px rgba(255, 80, 150, .45);

      transition: .4s;
    }

    .show-btn button:hover {
      transform: scale(1.06);

      box-shadow:
        0 0 60px rgba(255,80,150,.8);
    }
  </style>
</head>

<body>

  <div id="intro">

    <canvas id="canvas"></canvas>

    <div class="intro-text" id="intro-text">

      <div class="nice-day">
        SAVE THE DATE
      </div>

      <div class="wedding-date">
        4 / 8 / 2026
      </div>

      <div class="names">
        <span class="name">Mohamed</span>
        <span class="ampersand">&</span>
        <span class="name">Asmaa</span>
      </div>

    </div>

    <div class="show-btn" id="show-btn">
      <button onclick="showInvitation()">
        SHOW INVITATION
      </button>
    </div>

  </div>

  <script>
    const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

const cx = () => canvas.width / 2;
const cy = () => canvas.height / 2;

let frame = 0;
let textShown = false;
let heartLines = [];
let animId;

function heartPoint(t, scale) {

  return {
    x: cx() + scale * 16 * Math.pow(Math.sin(t), 3),

    y: cy() -
      scale *
      (
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t)
      )
  };
}

function buildHeart() {

  heartLines = [];

  const scale =
    Math.min(canvas.width, canvas.height) / 32;

  for (let i = 0; i < 1800; i++) {

    const t1 = Math.random() * Math.PI * 2;
    const t2 = Math.random() * Math.PI * 2;

    const p1 = heartPoint(t1, scale);
    const p2 = heartPoint(t2, scale);

    heartLines.push({

      x1: p1.x,
      y1: p1.y,

      x2: p2.x,
      y2: p2.y,

      alpha: Math.random(),

      width: .3 + Math.random() * .8,

      color:
        `hsla(${330 + Math.random()*20},
        100%,
        ${70 + Math.random()*20}%,
        .9)`
    });
  }
}

buildHeart();

function drawParticles() {

  for(let i=0;i<4;i++){

    const x=Math.random()*canvas.width;
    const y=Math.random()*canvas.height;

    ctx.beginPath();

    ctx.fillStyle="rgba(255,120,180,.25)";

    ctx.arc(x,y,Math.random()*2.2,0,Math.PI*2);

    ctx.fill();
  }
}

function animate() {

  animId=requestAnimationFrame(animate);

  frame++;

  ctx.fillStyle="rgba(4,2,8,.08)";
  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  const pulse =
    1 + Math.sin(frame * .03) * .02;

  ctx.save();

  ctx.translate(cx(), cy());

  ctx.scale(pulse, pulse);

  ctx.translate(-cx(), -cy());

  heartLines.forEach(l => {

    ctx.beginPath();

    ctx.strokeStyle = l.color;

    ctx.lineWidth = l.width;

    ctx.globalAlpha =
      .25 + Math.sin(frame * .02) * .1;

    ctx.shadowBlur = 10;
    ctx.shadowColor = l.color;

    ctx.moveTo(l.x1, l.y1);

    ctx.lineTo(l.x2, l.y2);

    ctx.stroke();
  });

  ctx.restore();

  drawParticles();

  if(frame > 120 && !textShown){

    textShown = true;

    document
      .getElementById("intro-text")
      .classList.add("visible");

    setTimeout(() => {

      document
        .getElementById("show-btn")
        .classList.add("visible");

    }, 700);
  }
}

animate();

function showInvitation(){

  const intro =
    document.getElementById("intro");

  intro.style.transition =
    "opacity .9s ease";

  intro.style.opacity = "0";

  cancelAnimationFrame(animId);

  setTimeout(() => {

    window.location.href =
      "main.html";

  }, 900);
    }
    </script>
</body>
</html>
