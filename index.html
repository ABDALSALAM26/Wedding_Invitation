<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Intro 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:"Cormorant Garamond", serif;
    background:
        radial-gradient(circle at top,
        rgba(255,107,157,.2), transparent 35%),

        radial-gradient(circle at bottom,
        rgba(255,255,255,.05), transparent 40%),

        #050505;
}

#intro{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
}

canvas{
    position:absolute;
    width:100%;
    height:100%;
}

.content{
    position:relative;
    z-index:5;
    text-align:center;

    padding:40px;

    background:rgba(255,255,255,.04);
    backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,.1);

    border-radius:35px;

    opacity:0;
    transform:translateY(40px);
    transition:1.5s;
}

.content.show{
    opacity:1;
    transform:translateY(0);
}

.title{
    font-family:"Great Vibes", cursive;
    color:white;
    font-size:clamp(42px,8vw,82px);

    text-shadow:
        0 0 30px rgba(255,107,157,.7);
}

.date{
    color:#ffd7e5;
    letter-spacing:6px;
    margin:15px 0 25px;
    font-size:clamp(16px,3vw,24px);
}

.names{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
}

.name{
    color:white;
    font-family:"Great Vibes";
    font-size:clamp(34px,6vw,60px);
}

.and{
    color:#ff6b9d;
    font-size:clamp(40px,7vw,70px);
    animation:pulse 2s infinite;
}

@keyframes pulse{
    50%{
        transform:scale(1.2);
    }
}

button{
    margin-top:35px;
    padding:15px 45px;

    border:none;
    border-radius:50px;

    color:white;
    cursor:pointer;

    font-size:16px;
    letter-spacing:4px;

    background:
    linear-gradient(135deg,
    rgba(255,107,157,.3),
    rgba(255,255,255,.08));

    backdrop-filter:blur(10px);

    transition:.4s;
}

button:hover{
    transform:translateY(-3px) scale(1.05);
    box-shadow:0 0 35px rgba(255,107,157,.4);
}
</style>
</head>

<body>

<div id="intro">

<canvas id="canvas"></canvas>

<div class="content" id="content">

<div class="title">Save The Date</div>

<div class="date">04 • 08 • 2026</div>

<div class="names">
<span class="name">Mohamed</span>
<span class="and">&</span>
<span class="name">Asmaa</span>
</div>

<button onclick="go()">SHOW INVITATION</button>

</div>

</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

window.onresize=()=>{
canvas.width=innerWidth;
canvas.height=innerHeight;
};

const cx=()=>canvas.width/2;
const cy=()=>canvas.height/2;

let progress=0;

function heart(t,s){
return{
x:cx()+s*16*Math.pow(Math.sin(t),3),

y:cy()-s*(
13*Math.cos(t)
-5*Math.cos(2*t)
-2*Math.cos(3*t)
-Math.cos(4*t))
};
}

function color(i,total){

const ratio=i/total;

const r=255;
const g=Math.floor(107+ratio*100);
const b=Math.floor(157+ratio*70);

return `rgb(${r},${g},${b})`;
}

function draw(){

requestAnimationFrame(draw);

ctx.clearRect(0,0,canvas.width,canvas.height);

const scale=Math.min(canvas.width,canvas.height)/28;

for(let i=0;i<100;i++){

let t1=(i/100)*Math.PI*2;
let t2=((i+1)/100)*Math.PI*2;

let p1=heart(t1,scale);
let p2=heart(t2,scale);

ctx.beginPath();

ctx.strokeStyle=color(i,100);

ctx.globalAlpha=.8+.2*Math.sin(Date.now()/400);

ctx.lineWidth=
3+Math.sin(Date.now()/250)*.7;

ctx.moveTo(p1.x,p1.y);

let px=p1.x+(p2.x-p1.x)*progress;
let py=p1.y+(p2.y-p1.y)*progress;

ctx.lineTo(px,py);

ctx.shadowBlur=15;
ctx.shadowColor=color(i,100);

ctx.stroke();
}

if(progress<1)
progress+=0.008;
}

draw();

setTimeout(()=>{
document
.getElementById("content")
.classList.add("show");
},2500);

function go(){

document.getElementById("intro")
.style.opacity="0";

setTimeout(()=>{
window.location.href="main.html";
},800);

}
</script>

</body>
</html>
